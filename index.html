<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTK Web Serial handshake</title>
<style>
  body{font:14px monospace;background:#111;color:#ddd;margin:12px}
  button{font:inherit;padding:10px 14px}
  pre{white-space:pre-wrap}
</style>
<button id="go">Connect + handshake</button>
<pre id="log"></pre>
<script>
const logEl = document.getElementById('log');
const log = m => { logEl.textContent += m + '\n'; };
const hex = b => '0x' + b.toString(16).padStart(2, '0').toUpperCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));
let busy = false;

async function run(port) {
  if (!navigator.serial) throw new Error('Web Serial unavailable (needs Chrome/Edge over https or localhost)');
  if (busy) return; busy = true;
  let reader, writer;
  try {
    // MediaTek VID 0x0E8D; BROM PID 0x0003, preloader 0x2000/0x2001
    port ||= (await navigator.serial.getPorts()).find(p => p.getInfo().usbVendorId === 0x0E8D)
          || await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x0E8D }] });
    const i = port.getInfo();
    log(`port ${hex(i.usbVendorId)}:${hex(i.usbProductId)}`);
    await port.open({ baudRate: 115200 });
    try { await port.setSignals({ dataTerminalReady: true, requestToSend: true }); } catch {}
    writer = port.writable.getWriter();
    reader = port.readable.getReader();

    // One outstanding read, reused across timeouts; byte queue on top
    let pending = null; const buf = [];
    const rd = () => pending ??= reader.read().then(
      r => { pending = null; if (r.done) throw new Error('port closed'); return r.value; },
      e => { pending = null; throw e; });
    const read1 = async ms => {
      if (buf.length) return buf.shift();
      const v = await Promise.race([rd(), sleep(ms).then(() => null)]);
      if (!v) return null;
      buf.push(...v); return buf.shift();
    };
    const drain = async () => { while (await read1(30) !== null); };
    const send = b => writer.write(Uint8Array.of(b));

    log('syncing: sending 0xA0 until 0x5F ... (BROM: key held, then plug in)');
    const t0 = Date.now();
    for (;;) {
      await send(0xA0);
      const r = await read1(50);
      if (r === 0x5F) { log('0xA0 -> 0x5F'); break; }
      if (Date.now() - t0 > 30000) throw new Error('sync timeout');
    }
    await drain();

    for (const [tx, rx] of [[0x0A, 0xF5], [0x50, 0xAF], [0x05, 0xFA]]) {
      await send(tx);
      const r = await read1(1000);
      if (r === null) throw new Error(`no reply to ${hex(tx)}`);
      if (r !== rx) throw new Error(`${hex(tx)} -> ${hex(r)}, expected ${hex(rx)}`);
      log(`${hex(tx)} -> ${hex(rx)}`);
    }
    log('handshake OK');

    // BROM commands: send cmd byte, device echoes it, then big-endian 16-bit words follow
    const readN = async n => {
      const out = [];
      while (out.length < n) {
        const b = await read1(1000);
        if (b === null) throw new Error('read timeout');
        out.push(b);
      }
      return out;
    };
    const word = async () => { const [h, l] = await readN(2); return (h << 8) | l; };
    const h16 = v => '0x' + v.toString(16).padStart(4, '0').toUpperCase();
    const echo = async c => {
      await send(c);
      const r = await read1(1000);
      if (r !== c) throw new Error(`echo ${hex(c)} -> ${r === null ? 'none' : hex(r)}`);
    };

    await echo(0xFD);                       // GET_HW_CODE
    const hwCode = await word(), st1 = await word();
    log(`GET_HW_CODE: hw_code=${h16(hwCode)} status=${h16(st1)}`);

    await echo(0xFC);                       // GET_HW_SW_VER
    const hwSub = await word(), hwVer = await word(), swVer = await word(), st2 = await word();
    log(`GET_HW_SW_VER: hw_sub=${h16(hwSub)} hw_ver=${h16(hwVer)} sw_ver=${h16(swVer)} status=${h16(st2)}`);
  } finally {
    try { await reader?.cancel(); } catch {}
    try { reader?.releaseLock(); writer?.releaseLock(); } catch {}
    try { await port?.close(); } catch {}
    busy = false;
  }
}

const fail = e => log(`ERROR: ${e.name}: ${e.message}`);
document.getElementById('go').onclick = () => run().catch(fail);

// Already-granted port re-attaching (e.g. preloader window) auto-starts the handshake
if (navigator.serial) navigator.serial.addEventListener('connect', e => {
  const i = e.target.getInfo?.() ?? {};
  if (i.usbVendorId !== 0x0E8D) return;
  log('MTK port attached'); run(e.target).catch(fail);
});
</script>
