<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTK Web Serial handshake</title>
<style>
  body{font:14px monospace;background:#111;color:#ddd;margin:12px}
  button{font:inherit;padding:10px 14px}
  pre{white-space:pre-wrap}
</style>
<button id="go">Connect + handshake</button>
<pre id="log"></pre>
<script>
const logEl = document.getElementById('log');
const log = m => { logEl.textContent += m + '\n'; };
const hex = b => '0x' + b.toString(16).padStart(2, '0').toUpperCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));
let busy = false;

async function run(port) {
  if (!navigator.serial) throw new Error('Web Serial unavailable (needs Chrome/Edge over https or localhost)');
  if (busy) return; busy = true;
  let reader, writer;
  try {
    // MediaTek VID 0x0E8D; BROM PID 0x0003, preloader 0x2000/0x2001
    port ||= (await navigator.serial.getPorts()).find(p => p.getInfo().usbVendorId === 0x0E8D)
          || await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x0E8D }] });
    const i = port.getInfo();
    log(`port ${hex(i.usbVendorId)}:${hex(i.usbProductId)}`);
    await port.open({ baudRate: 115200 });
    try { await port.setSignals({ dataTerminalReady: true, requestToSend: true }); } catch {}
    writer = port.writable.getWriter();
    reader = port.readable.getReader();

    // One outstanding read, reused across timeouts; byte queue on top
    let pending = null; const buf = [];
    const rd = () => pending ??= reader.read().then(
      r => { pending = null; if (r.done) throw new Error('port closed'); return r.value; },
      e => { pending = null; throw e; });
    const read1 = async ms => {
      if (buf.length) return buf.shift();
      const v = await Promise.race([rd(), sleep(ms).then(() => null)]);
      if (!v) return null;
      buf.push(...v); return buf.shift();
    };
    const drain = async () => { while (await read1(30) !== null); };
    const send = b => writer.write(Uint8Array.of(b));

    log('syncing: sending 0xA0 until 0x5F ... (BROM: key held, then plug in)');
    const t0 = Date.now();
    for (;;) {
      await send(0xA0);
      const r = await read1(50);
      if (r === 0x5F) { log('0xA0 -> 0x5F'); break; }
      if (Date.now() - t0 > 30000) throw new Error('sync timeout');
    }
    await drain();

    for (const [tx, rx] of [[0x0A, 0xF5], [0x50, 0xAF], [0x05, 0xFA]]) {
      await send(tx);
      const r = await read1(1000);
      if (r === null) throw new Error(`no reply to ${hex(tx)}`);
      if (r !== rx) throw new Error(`${hex(tx)} -> ${hex(r)}, expected ${hex(rx)}`);
      log(`${hex(tx)} -> ${hex(rx)}`);
    }
    log('handshake OK');

    // BROM commands: send cmd byte, device echoes it, then big-endian 16-bit words follow
    const readN = async n => {
      const out = [];
      while (out.length < n) {
        const b = await read1(1000);
        if (b === null) throw new Error('read timeout');
        out.push(b);
      }
      return out;
    };
    const word = async () => { const [h, l] = await readN(2); return (h << 8) | l; };
    const u32 = async () => { const [a, b, c, d] = await readN(4); return ((a << 24) | (b << 16) | (c << 8) | d) >>> 0; };
    const h16 = v => '0x' + v.toString(16).padStart(4, '0').toUpperCase();
    const h32 = v => '0x' + v.toString(16).padStart(8, '0').toUpperCase();
    const bytesHex = a => a.map(b => b.toString(16).padStart(2, '0')).join('');
    const echo = async c => {
      await send(c);
      const r = await read1(1000);
      if (r !== c) throw new Error(`echo ${hex(c)} -> ${r === null ? 'none' : hex(r)}`);
    };
    // Optional commands: a failure is logged, the line is drained, and we carry on
    const tryCmd = async (name, fn) => {
      try { await fn(); } catch (e) { log(`${name}: ${e.message}`); await drain(); }
    };

    await echo(0xFD);                       // GET_HW_CODE
    const hwCode = await word(), st1 = await word();
    log(`GET_HW_CODE: hw_code=${h16(hwCode)} status=${h16(st1)}`);

    await echo(0xFC);                       // GET_HW_SW_VER
    const hwSub = await word(), hwVer = await word(), swVer = await word(), st2 = await word();
    log(`GET_HW_SW_VER: hw_sub=${h16(hwSub)} hw_ver=${h16(hwVer)} sw_ver=${h16(swVer)} status=${h16(st2)}`);

    // --- step 1 additions ---

    await tryCmd('GET_BL_VER', async () => {   // 0xFE: echoes 0xFE in BROM, version byte in preloader
      await send(0xFE);
      const v = await read1(1000);
      if (v === null) throw new Error('no reply');
      log(`GET_BL_VER: ${hex(v)} (${v === 0xFE ? 'BROM' : 'preloader, version byte'})`);
    });

    await tryCmd('GET_TARGET_CONFIG', async () => {   // 0xD8: echo, u32 config, u16 status
      await echo(0xD8);
      const cfg = await u32(), st = await word();
      const f = m => (cfg & m) ? 'yes' : 'no';
      log(`GET_TARGET_CONFIG: ${h32(cfg)} status=${h16(st)}`);
      log(`  SBC=${f(0x1)} SLA=${f(0x2)} DAA=${f(0x4)} EPP=${f(0x8)} rootcert=${f(0x10)}`);
      log(`  memread_auth=${f(0x20)} memwrite_auth=${f(0x40)} cmdC8_blocked=${f(0x80)}`);
    });

    // 0xE1 / 0xE7: echo, u32 length, <length> bytes, u16 status
    const idCmd = (name, c) => tryCmd(name, async () => {
      await echo(c);
      const len = await u32();
      if (len > 64) throw new Error(`bad length ${len}`);
      const id = await readN(len);
      const st = await word();
      log(`${name}: ${bytesHex(id)} status=${h16(st)}`);
    });
    await idCmd('GET_ME_ID', 0xE1);
    await idCmd('GET_SOC_ID', 0xE7);

    // --- sanity check: WRITE32 one known value, then READ32 it back ---
    // Simpler than SEND_DA — isolates whether 0x50000000 is writable at all
    // and whether chunked writes land correctly, before trusting SEND_DA's result.
    if (hwCode === 0x335) {
      await tryCmd('WRITE32/READ32 sanity check', async () => {
        const echoU32 = async v => {
          await writer.write(Uint8Array.of((v >>> 24) & 0xFF, (v >>> 16) & 0xFF, (v >>> 8) & 0xFF, v & 0xFF));
          const got = await u32();
          if (got !== (v >>> 0)) throw new Error(`echo u32 ${h32(v)} -> ${h32(got)}`);
        };
        const addr = 0x50000000, testVal = 0xDEADBEEF;

        await echo(0xD2);              // WRITE32
        await echoU32(addr);
        await echoU32(1);              // 1 value
        const wst1 = await word();
        if (wst1 > 0xFF) throw new Error(`WRITE32 rejected: status=${h16(wst1)}`);
        await echoU32(testVal);
        const wst2 = await word();
        log(`WRITE32: wrote ${h32(testVal)} to ${h32(addr)}, status=${h16(wst1)}/${h16(wst2)}`);

        await echo(0xD1);              // READ32
        await echoU32(addr);
        await echoU32(1);
        const rst1 = await word();
        if (rst1 > 0xFF) throw new Error(`READ32 rejected: status=${h16(rst1)}`);
        const readBack = await u32();
        const rst2 = await word();
        log(`READ32: read back ${h32(readBack)} from ${h32(addr)}, status=${h16(rst1)}/${h16(rst2)}`
          + (readBack === testVal ? '  (match)' : '  (MISMATCH — single-word write/read did not round-trip)'));
      });
    }

    // --- step 2: SEND_DA test (upload-only, no JUMP_DA — nothing executes) ---
    // Only valid for hw_code 0x335 (MT6737M/MT6735G, your Lenovo K10A40).
    // Note: BROM's "hw_code" (0x335) and the DA container's "dacode" (0x6735)
    // are different numbering schemes for the same chip — both refer to it.
    // This stub is region[0] of mtkclient's MTK_DA_V5.bin for dacode 0x6735:
    // 624 bytes, destined for SRAM at 0x50000000. SEND_DA only copies bytes
    // into RAM and reads back a checksum — it can't touch flash or boot
    // anything on its own.
    if (hwCode === 0x335) {
      await tryCmd('SEND_DA (stage0 stub)', async () => {
        const b64 = "TU1NATgAAABGSUxFX0lORk8AAAABAAAABwAAAgAAAFBwAgAAAEAAADgAAAAAAQAAmQAhsAEAAACwtQQc" +
          "ACABJS0EATCoQvzbAPAo+AAoD9EA8Cb4ACgE0SAcAPAj+AAoF9EhHAAgAPAf+AAoEdEI4ADwFvgAKATRIBwA8BP4ACgH0QDw" +
          "FPgAKAPRATCoQvzbACCwvAi8GEcAIHBHACBwRwAgcEcAIHBHACBwR3BHACBwRwAA8AMt6QEw4OEBQIHgA1CD4ARghOAFcIXg" +
          "BoCG4AeQh+D6A4Do8AO96B7/L+HwHy3pAMCg4wEw4OHwD5DoAQBU4QnAoBMZAAAaAwBV4QrAoBMWAAAaARCB4AEAVuELwKAT" +
          "EgAAGgMwg+ADAFfhDMCgEw4AABoBEIHgAQBY4Q3AoBMKAAAaAzCD4AMAWeEOwKATBgAAGgEQgeABAFrhD8CgEwIAABoDMIPg" +
          "AwBb4RDAoBMMAKDh8B+96B7/L+HFNEk3xZFEajwtf3htgQ8CRv5AoU2W4I3q2aMO/623m9ELo5MXq0CDtk/5rqGSnkGc1Le0" +
          "PYoNkj42SMLAP0PYTp9dqVeDPgC5zfdhI7gfAlZJkp/PDONrcL07X9Z2IoCzzdFkRAdm0ZrfmCoeUEJ8PrH7XV2XUo7afFro" +
          "90a+ETOMTJEfEMm/JiFvO49DfGU2plS3hadoVsquT0CuONV6BTXNx580vXrTdU7utZwh6t3eM8cCfXZtdkZu5O3BdfJvY/t" +
          "4YXH3p1Rtc2LjeYaHyhHFIXOKmOi2b+2v3u76EWcXkgnsRrmpwUvCjfZoj2xOfUHMq/FWRZqAyfB1ssWW";
        const stub = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const address = 0x50000000, sigLen = 0;

        const echoU32 = async v => {
          await writer.write(Uint8Array.of((v >>> 24) & 0xFF, (v >>> 16) & 0xFF, (v >>> 8) & 0xFF, v & 0xFF));
          const got = await u32();
          if (got !== (v >>> 0)) throw new Error(`echo u32 ${h32(v)} -> ${h32(got)}`);
        };

        log(`SEND_DA: uploading ${stub.length}-byte stub to ${h32(address)} (SRAM, not executed)`);
        await echo(0xD7);              // SEND_DA
        await echoU32(address);
        await echoU32(stub.length);
        await echoU32(sigLen);

        const acceptStatus = await word();
        if (acceptStatus === 0x1D0D) throw new Error('SLA required (not implemented here)');
        if (acceptStatus > 0xFF) throw new Error(`DA_Send rejected: status=${h16(acceptStatus)}`);

        // Write in small chunks with a short gap, instead of one big write — BROM's
        // ROM-level USB stack has very little RX buffering, and mtkclient's own
        // backend writes in wMaxPacketSize pieces rather than all at once.
        const CHUNK = 64;
        for (let off = 0; off < stub.length; off += CHUNK) {
          await writer.write(stub.slice(off, off + CHUNK));
          await sleep(5);
        }
        await sleep(150);               // settle time before reading the reply, mirroring
                                         // mtkclient's time.sleep(0.12) after the upload
        let chk = 0;                    // mtkclient's checksum: XOR of little-endian 16-bit words
        for (let i = 0; i < stub.length; i += 2) chk ^= stub[i] | (stub[i + 1] << 8);

        const devChk = await word(), upStatus = await word();
        log(`SEND_DA: device_checksum=${h16(devChk)} local_checksum=${h16(chk)} status=${h16(upStatus)}`
          + (devChk === chk ? '  (match)' : devChk === 0 ? '  (0 — mtkclient treats this as non-fatal, verifying by readback)' : '  (MISMATCH)'));

        // Independent check: read the bytes back from SRAM via READ32 (0xD1) and
        // compare to what we meant to send, rather than trust the checksum alone.
        const dwords = Math.ceil(stub.length / 4);
        await echo(0xD1);                 // READ32
        await echoU32(address);
        await echoU32(dwords);
        const rstatus1 = await word();
        if (rstatus1 > 0xFF) throw new Error(`READ32 rejected: status=${h16(rstatus1)}`);
        const got = new Uint8Array(dwords * 4);
        for (let i = 0; i < dwords; i++) {
          const v = await u32();
          got[i * 4] = (v >>> 24) & 0xFF; got[i * 4 + 1] = (v >>> 16) & 0xFF;
          got[i * 4 + 2] = (v >>> 8) & 0xFF; got[i * 4 + 3] = v & 0xFF;
        }
        const rstatus2 = await word();
        let mismatches = 0, firstDiff = -1;
        for (let i = 0; i < stub.length; i++) {
          if (got[i] !== stub[i]) { mismatches++; if (firstDiff === -1) firstDiff = i; }
        }
        log(`READ32 verify: read ${dwords} dwords back, status=${h16(rstatus1)}/${h16(rstatus2)}, `
          + `${mismatches === 0 ? 'bytes match the stub exactly' : `${mismatches}/${stub.length} bytes differ`}`);
        if (firstDiff !== -1) {
          const lo = Math.max(0, firstDiff - 4), hi = Math.min(stub.length, firstDiff + 12);
          log(`  first diff at byte ${firstDiff}:`);
          log(`    expected: ${bytesHex(stub.slice(lo, hi))}`);
          log(`    got:      ${bytesHex(got.slice(lo, hi))}`);
        }
      });
    } else {
      log(`SEND_DA test skipped: hw_code ${h16(hwCode)} != 0x0335 (stub is chip-specific)`);
    }

    log('done');
  } finally {
    try { await reader?.cancel(); } catch {}
    try { reader?.releaseLock(); writer?.releaseLock(); } catch {}
    try { await port?.close(); } catch {}
    busy = false;
  }
}

const fail = e => log(`ERROR: ${e.name}: ${e.message}`);
document.getElementById('go').onclick = () => run().catch(fail);

// Already-granted port re-attaching (e.g. preloader window) auto-starts the handshake
if (navigator.serial) navigator.serial.addEventListener('connect', e => {
  const i = e.target.getInfo?.() ?? {};
  if (i.usbVendorId !== 0x0E8D) return;
  log('MTK port attached'); run(e.target).catch(fail);
});
</script>
